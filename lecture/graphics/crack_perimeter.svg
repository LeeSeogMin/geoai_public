  <text x="528" y="303" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">토막 14개 = 2 × (4 + 3) = 14m</text>
  <text x="528" y="323" font-size="12" text-anchor="middle" fill="#667085">모퉁이 칸은 두 변이 드러나 토막이 둘</text>

  <line x1="60" y1="352" x2="700" y2="352" stroke="#cbd5e1"/>
  <text x="380" y="376" font-size="12.5" text-anchor="middle" fill="#667085">같은 도형을 두 방식으로 세면 10과 14로 갈림</text>
  <text x="380" y="396" font-size="12.5" text-anchor="middle" fill="#667085">40m × 25m 필지라면 크랙 둘레는 2 × (40 + 25) = 130m</text>
